name: push-port-branch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download port-bundle --pattern 'custom-v230-port.bundle' --dir /tmp/b
      - name: Push branch from bundle
        run: |
          git fetch /tmp/b/custom-v230-port.bundle custom/v230-port
          git push origin FETCH_HEAD:refs/heads/custom/v230-port-src
